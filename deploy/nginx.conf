# /etc/nginx/sites-available/pulse-chat-api
# Reverse proxy for the Node API + Socket.IO. Certbot adds the TLS (443) block automatically.

upstream pulse_api {
    # ip_hash = sticky sessions. Required only if you run several Node processes AND clients may
    # fall back to HTTP long-polling. Harmless with a single process.
    ip_hash;
    server 127.0.0.1:5000;
    # server 127.0.0.1:5001;   # additional instances (also set REDIS_URL)
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Must be >= MAX_FILE_MB on the server
    client_max_body_size 25m;

    location /socket.io/ {
        proxy_pass http://pulse_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://pulse_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;   # stream uploads to Node
    }
}
